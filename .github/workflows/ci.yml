name: CI

on:
  pull_request:
  push:
    branches:
      - test_environment

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_PUBLIC_SUPABASE_URL: http://localhost
  VITE_PUBLIC_SUPABASE_ANON_KEY: anon-key

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
